<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SimpleCell</title>
</head>
<body>
<div id="app">
  <section class="page" id="page-landing"></section>
  <section class="page" id="page-explain" hidden></section>
  <section class="page" id="page-setup" hidden></section>

  <section class="page" id="page-world" hidden>
    <div class="world-grid">
      <aside class="rail" id="stats"></aside>
      <main id="stage"><canvas id="c"></canvas></main>
      <aside class="rail" id="inspect"></aside>
      <div class="bar">
        <button id="b-play" title="start / resume (space)">▶ Start</button>
        <button id="b-pause" title="pause (space)">❚❚ Pause</button>
        <button id="b-stop" title="end the run and see the summary (esc)">■ Stop</button>
        <span class="sep"></span>
        <button id="b-rewind" title="rewind (backspace / J)">◀◀</button>
        <input type="range" id="b-seek" min="0" max="1000" value="1000" title="scrub through held history" />
        <span class="sep"></span>
        <button id="b-slow" title="half speed (←)">0.5×</button>
        <span id="b-rate">1 tick/s</span>
        <button id="b-fast" title="double speed (→)">2×</button>
        <span id="help">shift-drag to feed · click an organism · . steps</span>
      </div>
    </div>
  </section>

  <section class="page" id="page-summary" hidden></section>
</div>
<script type="module">
import { initFromSeed } from '/src/core/params.ts'
import { World } from '/src/core/world.ts'
import { Renderer } from '/src/render/renderer.ts'
import { worldState } from '/src/sim/frames.ts'
import { StatsPanel } from '/src/ui/stats.ts'
import { InspectPanel } from '/src/ui/inspect.ts'
import { exportOrganism } from '/src/core/organism.ts'
import { census, lifeStats } from '/src/core/metrics.ts'
import '/src/ui/style.css'
const q = new URLSearchParams(location.search)
for (const p of document.querySelectorAll('.page')) p.hidden = p.id !== 'page-world'
const init = { ...initFromSeed(Number(q.get('seed') || 303)), walls: q.get('walls') || 'none', n_wall: 36, n_start: 6, n_intrinsic: 150, n_brain: 10 }
const w = new World(init)
for (let i = 0; i < Number(q.get('t') || 2500); i++) w.step()
const stats = new StatsPanel(document.getElementById('stats'))
const inspect = new InspectPanel(document.getElementById('inspect'), () => {})
const r = new Renderer(document.getElementById('c'), document.getElementById('stage'))
r.fit(init.size)
const o = w.orders.stats(w)
const st = { tick: w.tick, seed: init.seed, size: init.size, foodMode: init.foodMode, foodMoves: init.foodMoves, T: init.T, cap: w.cap, backend: '8 threads', tps: 624, census: census(w), life: lifeStats(w), aggregates: w.aggregates.stats(w), bondCount: w.bonds.count, orders: o, clampedPct: 100*w.nClamped/Math.max(1,w.nSteps), burned: w.burned, births: w.nBirths, budded: w.nBudded, deaths: w.nDeaths, recordAge: w.recordAge, historyTicks: 2400, oldestTick: 100 }
for (let k = 0; k < 220; k++) { st.tick = w.tick - 220 + k; stats.update(st, '1 tick/s', '8 threads · 624 tick/s · 2400t history') }
st.tick = w.tick; stats.update(st, '1 tick/s', '8 threads · 624 tick/s · 2400t history')
if (q.get('sel')) { const b = [...Array(w.nMatter).keys()].find(i => i >= w.nIntr && w.alive[i] && w.isBrain(i)); inspect.show(exportOrganism(w, b)); r.markOrganism(w.x[b], w.y[b]) }
r.snapshot(worldState(w)); r.draw(worldState(w), 1)
document.getElementById('b-play').classList.add('on')
document.title = 'done'
</script>
</body>
</html>
