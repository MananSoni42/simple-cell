<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SimpleCell</title>
</head>
<body>
<div id="app">
  <section class="page" id="page-landing"></section>
  <section class="page" id="page-explain" hidden></section>
  <section class="page" id="page-setup" hidden></section>

  <section class="page" id="page-world" hidden>
    <div class="world-grid">
      <aside class="rail" id="stats"></aside>
      <main id="stage"><canvas id="c"></canvas></main>
      <aside class="rail" id="inspect"></aside>
      <div class="tools" id="tools">
        <button data-tool="pan" title="pan and zoom (V)">✥ Look</button>
        <button data-tool="organism" title="place an organism (1)">◻ Organism</button>
        <span id="armed" class="armed-chip" hidden></span>
        <button data-tool="food" title="drop food (2)">◆ Food</button>
        <button data-tool="wall" title="paint terrain (3)">▦ Wall</button>
        <button data-tool="erase" title="erase (4)">⌫ Erase</button>
        <label class="brush">size <input type="range" id="brush" min="4" max="60" value="16" /></label>
        <span class="sep"></span>
        <button id="t-save" title="save this arrangement as a config">save world</button>
      </div>
      <div class="bar">
        <button id="b-play" title="start / resume (space)">▶ Start</button>
        <button id="b-pause" title="pause (space)">❚❚ Pause</button>
        <button id="b-stop" title="end the run and see the summary (esc)">■ Stop</button>
        <span class="sep"></span>
        <button id="b-rewind" title="rewind (backspace / J)">◀◀</button>
        <input type="range" id="b-seek" min="0" max="1000" value="1000" title="scrub through held history" />
        <span class="sep"></span>
        <button id="b-slow" title="half speed (←)">0.5×</button>
        <span id="b-rate">1 tick/s</span>
        <button id="b-fast" title="double speed (→)">2×</button>
        <span id="help"></span>
      </div>
    </div>
  </section>

  <section class="page" id="page-summary" hidden></section>
  <section class="page" id="page-library" hidden></section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
