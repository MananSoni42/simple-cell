<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cell Life</title>
<style>
  :root { color-scheme: dark; --bg:#06080d; --fg:#cfd6e4; --dim:#6b7589; --line:#1b2230; --accent:#7aa2ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow:hidden; }
  [hidden] { display:none !important; }
  #start { height:100%; display:grid; place-items:center; }
  .card { width:min(600px, 92vw); max-height:100vh; overflow:auto; padding:18px 0; }
  h1 { font-size:22px; font-weight:600; letter-spacing:.08em; margin:0 0 4px; }
  .sub { color:var(--dim); margin-bottom:22px; }
  .row { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
  select { background:#0d121b; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input, button { background:#0d121b; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  input { width:150px; } input:focus { outline:1px solid var(--accent); }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  table.m { border-collapse:separate; border-spacing:3px; margin-bottom:6px; }
  table.m td { width:58px; height:34px; text-align:center; border-radius:5px; font-size:12px; }
  table.m th { color:var(--dim); font-weight:400; padding:0 4px; }
  .legend { color:var(--dim); font-size:11px; margin-bottom:18px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 18px; margin:0 0 22px; }
  dt { color:var(--dim); } dd { margin:0; }
  .counts { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 14px; margin-bottom:22px; }
  .counts label { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--dim); }
  .counts input { width:72px; }
  .check { display:block; color:var(--fg); margin-bottom:8px; } .check .dim { color:var(--dim); font-size:11px; }
  .go { color:var(--accent); letter-spacing:.06em; }
  #world { position:fixed; inset:0; }
  #c { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #stats { position:absolute; left:14px; top:12px; width:250px; padding:10px 12px; background:rgba(11,14,20,.78); border:1px solid var(--line); border-radius:8px; pointer-events:none; font-size:12px; }
  #stats .hd { display:flex; justify-content:space-between; font-weight:600; }
  #stats .dim, #stats .sub { color:var(--dim); font-size:11px; line-height:1.35; }
  #stats .blk { margin-top:9px; }
  #stats .row { display:flex; justify-content:space-between; align-items:baseline; }
  #stats i { font-style:normal; }
  #stats canvas { width:100%; height:26px; display:block; margin-top:2px; }
  #controls { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; padding:6px 10px; background:rgba(11,14,20,.82); border:1px solid var(--line); border-radius:10px; }
  #controls button { padding:5px 12px; }
  #controls button.on { border-color:var(--accent); color:var(--accent); }
  #controls .sep { width:1px; height:18px; background:var(--line); margin:0 4px; }
  #b-rate { min-width:78px; text-align:center; color:var(--dim); }
  #help { position:absolute; left:14px; bottom:12px; color:var(--dim); pointer-events:none; }
</style>
</head>
<body>
<div id="start"></div>
<div id="world" hidden>
  <canvas id="c"></canvas>
  <div id="stats"></div>
  <div id="controls">
    <button id="b-play" title="start / resume (space)">▶ Start</button>
    <button id="b-pause" title="pause (space)">❚❚ Pause</button>
    <button id="b-stop" title="stop and return to the start screen (esc)">■ Stop</button>
    <span class="sep"></span>
    <button id="b-slow" title="half speed (←)">0.5×</button>
    <span id="b-rate">1 tick/s</span>
    <button id="b-fast" title="double speed (→)">2×</button>
  </div>
  <div id="help">fill level = energy · red = starving · . single-step</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
